<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShallowSID usage</title>
<style>
:root{color-scheme:dark;--bg:#11151c;--panel:#1b222c;--muted:#a9b5c5;--accent:#69dbc1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf2f8;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 22px}h1{margin:0;font-size:30px}h2{font-size:18px;margin:0 0 16px}.muted,small{color:var(--muted)}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,section{background:var(--panel);padding:20px;border:1px solid #303b4a;border-radius:12px}.value{font-size:27px;font-weight:650;margin:10px 0}.card p{margin:6px 0;font-size:13px;color:var(--muted)}progress{width:100%;height:8px;accent-color:var(--accent)}section{margin-top:18px}select{background:var(--panel);color:inherit;border:1px solid #45556b;padding:9px;border-radius:7px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:right;padding:10px;border-bottom:1px solid #303b4a}th:first-child,td:first-child{text-align:left}td.path{overflow-wrap:anywhere;max-width:700px}.scroll{overflow-x:auto}svg{width:100%;height:180px;display:block}.legend{display:flex;gap:18px;margin-bottom:10px;font-size:13px}.dot{display:inline-block;width:9px;height:9px;margin-right:6px;background:var(--accent);border-radius:2px}.dot.project{background:#6a86ad}footer{font-size:12px;color:var(--muted);line-height:1.6;margin-top:22px}.empty{color:var(--muted);margin:0}.notice{color:#ffd994;margin:0 0 18px}a{color:var(--accent)}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}header{align-items:flex-start;flex-direction:column}main{padding:22px 14px}.value{font-size:23px}}@media(max-width:400px){.cards{grid-template-columns:1fr}}
</style></head><body><main>
<header><div><h1>ShallowSID usage</h1><p class="muted" id="subtitle"></p></div><label>Period <select id="period"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select></label></header>
<div id="errors" class="notice"></div><div class="cards" id="cards"></div>
<section><h2 id="chart-title">Daily bandwidth · UTC</h2><label>Graph <select id="graph-mode"><option value="daily">Daily</option><option value="cumulative">Cumulative</option></select></label><div class="legend"><span><i class="dot"></i><span id="site-legend"></span></span><span><i class="dot project"></i><span id="project-legend"></span></span></div><svg id="chart" role="img" aria-label="Daily bandwidth"></svg><div class="scroll"><table><thead><tr><th>Date</th><th>Site transfer</th><th>Project transfer</th><th>Monthly quota used that day</th><th>SID GET responses</th><th>Requests</th></tr></thead><tbody id="daily"></tbody></table></div></section>
<section><h2>Top 50 tunes by GET responses</h2><p id="log-note" class="muted"></p><div class="scroll"><table id="files"><thead><tr><th>HVSC path</th><th>GET responses</th></tr></thead><tbody></tbody></table></div></section>
<section><h2>Sync groups · last update date (UTC)</h2><p id="sync-note" class="muted"></p><table><thead><tr><th>Last update date</th><th>Groups</th></tr></thead><tbody id="sync-dates"></tbody></table></section><footer id="footer"></footer></main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent);
const $=id=>document.getElementById(id), format=n=>n==null?'Unavailable':Number(n).toLocaleString('en'), bytes=n=>{if(n==null)return 'Unavailable';for(const [unit,size] of [['GB',1e9],['MB',1e6],['KB',1e3]])if(n>=size)return (n/size).toFixed(2)+' '+unit;return Math.round(n)+' B'}, pct=(n,d)=>n==null||!d?'Unavailable':(100*n/d).toFixed(3)+'%';
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
function values(metric){return data.gauges[metric]||[]}
function sumValues(metric){const v=values(metric);return v.length?v.reduce((n,p)=>n+p.value,0):null}
function limit(metric){const v=values(metric);return v.length?Math.min(...v.map(p=>p.value)):null}
const quota=limit('network/monthly_sent_limit'), monthly=sumValues('network/monthly_sent');
function card(label,value,note,used=null,total=null){const e=el('div',null,'card');e.append(el('div',label,'muted'),el('div',value,'value'));if(used!=null&&total){const p=el('progress');p.max=total;p.value=used;p.setAttribute('aria-label',label);e.append(p)}e.append(el('p',note));$('cards').append(e)}
function render(){const days=Math.min(Number($('period').value),data.days);$('cards').replaceChildren();$('daily').replaceChildren();const end=new Date(data.generated),start=new Date(Date.UTC(end.getUTCFullYear(),end.getUTCMonth(),end.getUTCDate()));start.setUTCDate(start.getUTCDate()-days+1);const rows=[];for(let d=new Date(start);d<=end;d.setUTCDate(d.getUTCDate()+1)){const day=d.toISOString().slice(0,10);rows.push({day,site:data.daily_site_bytes[day]??null,project:data.daily_project_bytes[day]??null,downloads:data.logs?.available?(data.logs.daily_downloads[day]||0):null,requests:data.logs?.available?(data.logs.daily_requests[day]||0):null})}
const siteSum=rows.some(r=>r.site!=null)?rows.reduce((a,r)=>a+(r.site||0),0):null;
card('Site bandwidth',bytes(siteSum),days+' days · '+data.site+' Hosting site');card('Monthly project quota',pct(monthly,quota),bytes(monthly)+' / '+bytes(quota)+' · latest reported samples',monthly,quota);card('Sync groups',format(data.sync_groups),data.sync_updates?.latest?'Last updated '+new Date(data.sync_updates.latest).toLocaleString():'Update date unavailable');
card('SID GET responses',data.logs?.available?(data.logs.complete?'':'≥ ')+format(rows.reduce((a,r)=>a+r.downloads,0)):'Unavailable','All HTTP statuses');const storage=sumValues('storage/total_bytes'),storageLimit=limit('storage/limit');card('Hosting storage',bytes(storage),bytes(storageLimit)+' quota · includes retained releases',storage,storageLimit);
for(const row of rows.reverse()){const tr=el('tr');for(const value of [row.day,bytes(row.site),bytes(row.project),pct(row.project,quota),format(row.downloads),format(row.requests)])tr.append(el('td',value));$('daily').append(tr)}
const cumulative=$('graph-mode').value==='cumulative';$('chart-title').textContent=(cumulative?'Cumulative':'Daily')+' bandwidth · UTC';const svg=$('chart');svg.replaceChildren();svg.setAttribute('viewBox','0 0 1000 180');let chronological=rows.slice().reverse();if(cumulative){let siteTotal=0,projectTotal=0;chronological=chronological.map(row=>({...row,site:row.site==null?null:(siteTotal+=row.site),project:row.project==null?null:(projectTotal+=row.project)}))}const max=Math.max(1,...chronological.map(r=>Math.max(r.project||0,r.site||0))),width=1000/rows.length;svg.setAttribute('aria-label',(cumulative?'Cumulative':'Daily')+' bandwidth');for(const [i,row] of chronological.entries()){for(const [value,color,x,w] of [[row.project,'#6a86ad',i*width,width*.85],[row.site,'#69dbc1',i*width+width*.2,width*.45]]){if(value==null)continue;const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',x);rect.setAttribute('y',170-150*value/max);rect.setAttribute('width',w);rect.setAttribute('height',150*value/max);rect.setAttribute('fill',color);const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=row.day+': '+bytes(value);rect.append(title);svg.append(rect)}}}
$('site-legend').textContent=data.site+'.web.app + '+data.site+'.firebaseapp.com';$('project-legend').textContent=data.project+' project total (includes retired shallowsid-hvsc)';
$('subtitle').textContent=data.site+'.web.app · Generated '+new Date(data.generated).toLocaleString();
$('errors').textContent=data.errors.join(' · ');
for(const option of $('period').options)if(Number(option.value)>data.days)option.disabled=true;
$('period').value=String(data.days>=30?30:7);if(![7,30,90].includes(data.days)){const option=el('option',data.days+' days');option.value=data.days;$('period').append(option);$('period').value=String(data.days)}
$('period').addEventListener('change',render);$('graph-mode').addEventListener('change',render);render();
$('sync-note').textContent=data.sync_updates?.latest?'Latest group update: '+new Date(data.sync_updates.latest).toISOString().replace('T',' ').replace('Z',' UTC'):'Update dates unavailable';
for(const [date,count] of Object.entries(data.sync_updates?.dates||{})){const tr=el('tr');tr.append(el('td',date),el('td',format(count)));$('sync-dates').append(tr)}
const tbody=$('files').querySelector('tbody');for(const [path,count] of data.logs?.top_files||[]){const tr=el('tr');tr.append(el('td',path,'path'),el('td',format(count)));tbody.append(tr)}
if(!data.logs?.top_files?.length)$('files').hidden=true;
$('log-note').textContent=!data.logs?.available?'No request logs returned. Logging may be disabled or there may be no retained requests in this period. Rankings and GET counts are unavailable.':(data.logs.complete?'':'Partial report: scan limit reached. Counts are lower bounds. ')+data.logs.scanned.toLocaleString()+' logged requests scanned across the full '+data.days+'-day report window. File rankings use that full window.';
$('footer').textContent='Read-only snapshot. No IP addresses, user agents, referrers, sync keys or encrypted sync contents are saved. Bandwidth covers all Hosting responses, including bots and redirects. Project quota includes all sites, including traffic from the retired HVSC site. Daily rows use UTC; absent metric samples are unavailable. The current day is partial. Google metrics can arrive late; monthly gauges are sampled roughly every eight hours. SID GET counts include all HTTP statuses, including errors and cache revalidation; repeated requests count separately. Sync dates are each stored group’s last Firestore write, not a history of sync events. Sync records may be old, shared or migrated. Cumulative graphs sum available samples from the selected period’s start; missing samples remain gaps.';
</script></body></html>
