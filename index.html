<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <!-- Only this site, jsDelivr (libraries), HVSC (tunes) and Firestore (sync, shared lists). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.hvsc.c64.org https://firestore.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#16131f">
  <meta name="description" content="ShallowSID is a free web player that gives you instant access to over 60,000 Commodore 64 tunes from the High Voltage SID Collection. No account, no ads: just press play.">
  <title>ShallowSID - the easy C64 music web player</title>
  <!-- Link previews (Open Graph, X/Twitter): crawlers need absolute URLs -->
  <link rel="canonical" href="https://ventti.github.io/shallowsid/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ShallowSID">
  <meta property="og:title" content="ShallowSID - the easy C64 music web player">
  <meta property="og:description" content="Free, instant access to over 60,000 Commodore 64 tunes from the High Voltage SID Collection. No account, no ads: just press play.">
  <meta property="og:url" content="https://ventti.github.io/shallowsid/">
  <meta property="og:image" content="https://ventti.github.io/shallowsid/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ShallowSID, the easy C64 music web player">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <!-- PNG and ICO too: link-preview crawlers (Slack, Discord, iMessage) don't read SVG -->
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShallowSID">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.4/css/ionic.bundle.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.4/css/palettes/dark.always.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/ionic-config.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.4/dist/ionic/ionic.esm.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <ion-app>
    <div class="layout">
      <div class="ion-page" id="main-page">
        <ion-header>
          <ion-toolbar id="title-toolbar">
            <ion-buttons slot="start">
              <ion-button id="back" hidden aria-label="Back"><ion-icon slot="icon-only" name="chevron-back"></ion-icon></ion-button>
            </ion-buttons>
            <ion-title id="title"></ion-title>
            <ion-buttons slot="end">
              <!-- plain wrapper: re-rendering inside Ionic's scoped slot directly loses the nodes -->
              <div id="toolbar-actions" class="toolbar-actions"></div>
            </ion-buttons>
          </ion-toolbar>
          <ion-toolbar id="search-toolbar">
            <ion-searchbar id="searchbar" placeholder="Search tunes, composers, groups…" debounce="200" autocapitalize="off" spellcheck="false"></ion-searchbar>
            <ion-buttons slot="end">
              <ion-button id="sort-button" class="sort-button" hidden aria-label="Sort results">
                <ion-icon slot="start" name="swap-vertical"></ion-icon><span id="sort-label">Relevance</span>
              </ion-button>
              <ion-button id="sort-direction" class="sort-direction" hidden aria-label="Reverse order">
                <ion-icon slot="icon-only" name="arrow-up"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>

        <ion-content id="content">
          <div id="view"><div class="empty"><ion-spinner></ion-spinner><p>Loading the HVSC index…</p></div></div>
          <ion-infinite-scroll id="infinite" threshold="400px" disabled>
            <ion-infinite-scroll-content></ion-infinite-scroll-content>
          </ion-infinite-scroll>
          <footer class="credits">
            <a href="https://www.hvsc.c64.org/" target="_blank" rel="noopener" id="hvsc-version">HVSC</a> ·
            <a href="about.html" target="_blank" rel="noopener">About ShallowSID</a><span id="install-app-wrap" hidden> ·
            <a href="#" id="install-app">Install app</a></span>
          </footer>
        </ion-content>

        <ion-footer>
          <div id="mini" class="mini" hidden>
            <div class="mini-progress"><div id="mini-bar"></div></div>
            <div class="mini-row">
              <div id="mini-art" class="thumb"></div>
              <div class="mini-text">
                <div id="mini-title" class="mini-title"></div>
                <div id="mini-author" class="mini-author"></div>
              </div>
              <ion-button fill="clear" id="mini-play" aria-label="Play"><ion-icon slot="icon-only" name="play"></ion-icon></ion-button>
              <ion-button fill="clear" id="mini-next" aria-label="Next"><ion-icon slot="icon-only" name="play-skip-forward"></ion-icon></ion-button>
            </div>
          </div>
          <ion-tab-bar id="tab-bar" selected-tab="search">
            <ion-tab-button tab="home"><ion-icon name="home"></ion-icon><ion-label>Home</ion-label></ion-tab-button>
            <ion-tab-button tab="browse"><ion-icon name="folder-open"></ion-icon><ion-label>Browse</ion-label></ion-tab-button>
            <ion-tab-button tab="playlists"><ion-icon name="library"></ion-icon><ion-label>Playlists</ion-label></ion-tab-button>
          </ion-tab-bar>
        </ion-footer>
      </div>

      <aside id="side-panel" class="side-panel" aria-label="Now playing"></aside>
    </div>

    <ion-modal id="np-modal" handle="true" class="np-modal">
      <ion-content><div id="np-host"></div></ion-content>
    </ion-modal>

    <ion-modal id="sound-modal" class="sound-modal">
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start"><ion-button id="sound-revert" hidden>Revert</ion-button></ion-buttons>
          <ion-title>Sound</ion-title>
          <ion-buttons slot="end"><ion-button id="sound-done" strong="true">Done</ion-button></ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="sound-content"><div id="sound-sheet"></div></ion-content>
    </ion-modal>
    <input type="file" id="sound-import-input" accept=".json,application/json" hidden>

    <ion-modal id="sync-modal" class="sound-modal">
      <ion-header>
        <ion-toolbar>
          <ion-title>Sync</ion-title>
          <ion-buttons slot="end"><ion-button id="sync-done" strong="true">Done</ion-button></ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="sound-content"><div id="sync-sheet"></div></ion-content>
    </ion-modal>

    <!-- Now Playing: moved between the modal (phones) and the side panel (desktop) -->
    <section id="np" class="np is-paused">
      <div class="np-art-wrap">
        <div id="np-art" class="np-art" role="button" aria-label="Cover: tap to play or pause, swipe to skip"><span>♪</span></div>
      </div>
      <div class="np-meta">
        <div class="np-title-row">
          <div>
            <h1 id="np-title">Nothing playing</h1>
            <p id="np-author" class="np-author" role="link" tabindex="0" title="Search for this composer">Pick a tune</p>
          </div>
          <ion-button fill="clear" id="np-fav" class="np-fav" aria-label="Add to Favorites" aria-pressed="false" hidden><ion-icon slot="icon-only" name="star-outline"></ion-icon></ion-button>
          <ion-button fill="clear" id="np-share" class="np-fav" aria-label="Share" hidden><ion-icon slot="icon-only" name="share-outline"></ion-icon></ion-button>
        </div>
        <p id="np-released" class="np-released"></p>
        <div id="np-badges" class="np-badges"></div>
      </div>
      <div class="np-scrub">
        <canvas id="np-wave" class="np-wave" tabindex="0" role="slider" aria-label="Seek"></canvas>
        <div class="np-times"><span id="np-pos">0:00</span><span id="np-state" class="np-state"></span><span id="np-dur">0:00</span></div>
      </div>
      <div class="np-controls">
        <ion-button fill="clear" id="np-prev" aria-label="Previous"><ion-icon slot="icon-only" name="play-skip-back"></ion-icon></ion-button>
        <ion-button shape="round" id="np-play" class="np-play" aria-label="Play"><ion-icon slot="icon-only" name="play"></ion-icon></ion-button>
        <ion-button fill="clear" id="np-next" aria-label="Next"><ion-icon slot="icon-only" name="play-skip-forward"></ion-icon></ion-button>
      </div>
      <div class="np-extra">
        <ion-select id="np-subtune" interface="action-sheet" label="Subtune" label-placement="stacked" hidden></ion-select>
        <ion-button fill="clear" size="small" id="np-add"><ion-icon slot="start" name="add-circle-outline"></ion-icon>Playlist</ion-button>
        <ion-button fill="clear" size="small" id="np-folder"><ion-icon slot="start" name="folder-open-outline"></ion-icon>Folder</ion-button>
        <ion-button fill="clear" size="small" id="np-sound"><ion-icon slot="start" name="options-outline"></ion-icon>Sound</ion-button>
      </div>
      <p id="np-hint" class="np-hint">Tap the cover to play/pause · swipe it to skip</p>
      <ion-list id="np-queue" class="np-queue" lines="none"></ion-list>
    </section>

    <input type="file" id="import-input" accept=".m3u,.m3u8,audio/x-mpegurl,audio/mpegurl,application/vnd.apple.mpegurl" hidden>
  </ion-app>
</body>
</html>
