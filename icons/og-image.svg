<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221d31"/>
      <stop offset="1" stop-color="#16131f"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee0c0"/>
      <stop offset="0.5" stop-color="#a99cff"/>
      <stop offset="1" stop-color="#ff8fb1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- the favicon, large -->
  <g transform="translate(100 165) scale(9.375)">
    <rect width="32" height="32" rx="7" fill="#a99cff"/>
    <path d="M8 21h4v-8h4v8h4V9h4v14" stroke="#16131f" stroke-width="3" fill="none"/>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="470" y="275" font-size="104" font-weight="700" fill="#ece9f5">ShallowSID</text>
    <text x="474" y="350" font-size="46" font-weight="500" fill="#a99cff">The easy C64 music web player</text>
    <text x="474" y="420" font-size="30" fill="#a39db5">60,000+ tunes from the High Voltage SID Collection</text>
  </g>
  <!-- a strip of level bars along the bottom -->
  <g fill="url(#bars)" opacity="0.85">
    <rect x="0" y="600" width="1200" height="30"/>
  </g>
</svg>
