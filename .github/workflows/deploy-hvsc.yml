name: Deploy HVSC to Firebase Hosting

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/deploy-hvsc.yml
      - firebase.json
      - tools/prepare_hvsc_hosting.py
      - tests/test_hvsc_hosting.py
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-hvsc.yml
      - firebase.json
      - tools/fetch_hvsc.py
      - tools/prepare_hvsc_hosting.py
      - tools/check_hvsc_hosting.py
  schedule:
    # HVSC normally releases in late June and December; check just afterwards.
    - cron: "23 3 1 1,7 *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: hvsc-hosting
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python3 -m unittest discover -s tests -p 'test_hvsc_hosting.py'

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve latest HVSC
        id: hvsc
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from fetch_hvsc import latest_version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"version={latest_version()['version']}\n")
          PY

      - uses: actions/cache@v6
        with:
          path: ~/.cache/shallowsid/*.7z
          key: hvsc-${{ steps.hvsc.outputs.version }}

      - name: Download and prepare SID files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y 7zip
          python3 tools/fetch_hvsc.py --dest _hvsc-source --keep-archive
          python3 tools/prepare_hvsc_hosting.py

      - name: Skip unchanged collections and prevent downgrades
        id: changes
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from prepare_hvsc_hosting import needs_deploy
          local = json.loads(Path('_hvsc-hosting/manifest.json').read_text())
          try:
              with urllib.request.urlopen('https://shallowsid-hvsc.web.app/manifest.json', timeout=60) as response:
                  remote = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              remote = {}
          # Manifest includes the configuration hash, so header changes deploy too.
          changed = needs_deploy(local, remote)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"changed={str(changed).lower()}\n")
          print('Deployment required' if changed else 'HVSC and hosting configuration unchanged')
          PY

      - name: Authenticate using existing GitHub Workload Identity
        if: steps.changes.outputs.changed == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # CLI uploads every file individually as level-9 gzip; unchanged content
      # is reused by hash. Never deploy Firestore rules from this workflow.
      - name: Deploy SID hosting
        if: steps.changes.outputs.changed == 'true'
        run: |
          time npx --yes firebase-tools@15.31.0 deploy --only hosting --project shallowsid --non-interactive

      - name: Verify deployed collection, gzip and CORS
        if: steps.changes.outputs.changed == 'true'
        run: python3 tools/check_hvsc_hosting.py
