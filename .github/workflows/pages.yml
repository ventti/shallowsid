name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # HVSC is released about twice a year (around June/July and December/January):
    # rebuild the catalogue every Monday in those months to pick up a new release.
    - cron: "17 3 * 6,7,12,1 1"
    # GitHub disables scheduled workflows after 60 days without repo activity.
    # The months in between only re-enable this workflow (see the keepalive job),
    # which keeps the longest gap to about five weeks.
    - cron: "17 3 1 2-5,8-11 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow (resets the 60-day inactivity timer)
        run: gh workflow enable pages.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    # Keepalive-only runs skip the rebuild.
    if: github.event.schedule != '17 3 1 2-5,8-11 *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Unit tests
        run: node --test "tests/*.test.mjs"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Resolve HVSC version
        id: hvsc
        run: echo "version=$(curl -fsS https://www.hvsc.c64.org/api/v1/version | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])' || echo 85)" >> "$GITHUB_OUTPUT"

      - name: Cache HVSC archive
        uses: actions/cache@v6
        with:
          path: ~/.cache/shallowsid/*.7z
          key: hvsc-${{ steps.hvsc.outputs.version }}

      - name: Build song catalogue
        run: python3 tools/build_index.py --out _site --keep-archive

      - name: Assemble site
        run: |
          cp -r index.html privacy.html about.html manifest.webmanifest service-worker.js icons css js _site/
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
