name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Unit tests
        run: node --test "tests/*.test.mjs"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Resolve HVSC version
        id: hvsc
        run: echo "version=$(curl -fsS https://www.hvsc.c64.org/api/v1/version | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])' || echo 85)" >> "$GITHUB_OUTPUT"

      - name: Cache HVSC archive
        uses: actions/cache@v6
        with:
          path: ~/.cache/shallowsid/*.7z
          key: hvsc-${{ steps.hvsc.outputs.version }}

      - name: Build song catalogue
        run: python3 tools/build_index.py --out _site --keep-archive

      - name: Assemble site
        run: |
          cp -r index.html css js _site/
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
