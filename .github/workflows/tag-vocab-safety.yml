name: Tag vocabulary safety
on:
  pull_request:
    paths:
      - js/tags-vocab.json
      - tools/sync_tag_vocab.py
      - tests/test_tag_vocab.py
      - .github/workflows/tag-vocab-safety.yml
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Export validation tests
        run: python3 -m unittest discover -s tests -p test_tag_vocab.py
      - name: Sync PR contains only vocabulary additions
        if: github.head_ref == 'automation/tag-vocabulary'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git diff --name-only "$BASE_SHA...$HEAD_SHA")" = 'js/tags-vocab.json'
          git show "$BASE_SHA:js/tags-vocab.json" > /tmp/tags-vocab-before.json
          python3 tools/sync_tag_vocab.py --before /tmp/tags-vocab-before.json
