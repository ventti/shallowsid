name: Publish admin changes
# Publishes what admins changed in the app: tag definitions into
# js/tags-vocab.json and curated list items into js/curated-lists.json. One
# bot PR holds both files; it merges when its checks pass.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: admin-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # A dedicated fine-grained token triggers PR checks and the merged main
      # deployment. GITHUB_TOKEN would suppress those workflow events.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT_PR_READWRITE }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check configuration
        env:
          TOKEN: ${{ secrets.GH_PAT_PR_READWRITE }}
        run: test -n "$TOKEN"
      - uses: google-github-actions/auth@v3
        id: gcp
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Read tag definitions and update the vocabulary
        run: python3 tools/sync_tag_vocab.py
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
      - name: Read curated list items and update the lists
        run: python3 tools/sync_curated_lists.py
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
      - name: Create or update sync PR
        uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          token: ${{ secrets.GH_PAT_PR_READWRITE }}
          branch: automation/admin-data
          add-paths: |
            js/tags-vocab.json
            js/curated-lists.json
          commit-message: Publish admin changes
          title: Publish admin changes
          body: Publishes admin tag additions and edits into the vocabulary, and curated list changes into js/curated-lists.json. Automated checks reject removed tags and invalid lists, and test the generated Firestore rules before merging.
          delete-branch: true
      - name: Wait for checks and merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PR_READWRITE }}
        run: tools/merge_when_green.sh "${{ steps.pr.outputs.pull-request-number }}" check safety
